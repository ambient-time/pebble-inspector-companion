releaseNotes=Recordings wake the phone to keep their schedule with the screen off, and missed samples are counted. Bluetooth scans taken with the screen off are marked as limited. A Home action confirmed on the watch keeps its result, and a lost reply no longer says Home was unavailable. Each history export gets its own file. The download drops from 151 MB to 94 MB because it carries only 64-bit ARM code, so it no longer installs on 32-bit phones. Updates in place over 0.9.8 (30).
